name: Release VR Log Inspector

# Push a tag like  log-inspector-v1.5  to build both zips and publish them as a GitHub release.
on:
  push:
    tags: ["log-inspector-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vr-log-inspector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match TOOL_VERSION
        run: |
          code_version=$(python -c "import re;print(re.search(r'^TOOL_VERSION = \"([^\"]+)\"', open('vr_log_inspector.py').read(), re.M).group(1))")
          tag_version="${GITHUB_REF_NAME#log-inspector-v}"
          echo "code $code_version / tag $tag_version"
          test "$code_version" = "$tag_version"
      - name: Contrast check
        run: python ../tools/check_contrast.py vr_log_inspector.py
      - name: Build normal and portable packages
        # where installed copies look for updates: the UPDATE_SOURCE repository variable,
        # or this repo's releases when it isn't set (users of a private repo then need a token)
        run: python build_release.py --portable --out dist --update-source "${{ vars.UPDATE_SOURCE || format('github:{0}', github.repository) }}"
      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'PY'
          import os, re
          ver = os.environ["GITHUB_REF_NAME"].removeprefix("log-inspector-v")
          text = open("../CHANGELOG.md", encoding="utf-8").read()
          part = text.split("## VR Log Inspector", 1)[1].split("\n## ", 1)[0]
          m = re.search(r"^### " + re.escape(ver) + r"\b.*?(?=^### |\Z)", part, re.M | re.S)
          open("notes.md", "w", encoding="utf-8").write(m.group(0) if m else f"VR Log Inspector {ver}")
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/latest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/latest.json --title "VR Log Inspector ${GITHUB_REF_NAME#log-inspector-v}" --notes-file notes.md
          fi
